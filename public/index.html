<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Lorem Ipsum</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="toolbar">
      <h1>Items</h1>
      <div class="controls">
        <label class="search">
          <span class="visually-hidden">Search items</span>
          <input type="search" id="search" placeholder="Search name or category">
        </label>
        <button type="button" id="add-btn">Add item</button>
      </div>
    </header>

    <p id="status" role="status" aria-live="polite" class="status"></p>

    <div class="table-wrap">
      <table id="items-table">
        <thead>
          <tr>
            <th scope="col" aria-sort="ascending"><button type="button" data-sort="id">ID</button></th>
            <th scope="col"><button type="button" data-sort="name">Name</button></th>
            <th scope="col"><button type="button" data-sort="category">Category</button></th>
            <th scope="col"><button type="button" data-sort="price">Price</button></th>
            <th scope="col"><button type="button" data-sort="stock">Stock</button></th>
            <th scope="col"><button type="button" data-sort="status">Status</button></th>
            <th scope="col"><button type="button" data-sort="updated_at">Updated</button></th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>

    <nav class="pagination" aria-label="Pagination">
      <button type="button" id="prev-btn">Previous</button>
      <span id="page-info"></span>
      <button type="button" id="next-btn">Next</button>
    </nav>
  </main>

  <script type="module" src="js/table.js"></script>
</body>
</html>
